name: Build S25 Subtitle APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Find and Build Debug APK
        run: |
          if [ -f "build.gradle" ]; then
            gradle assembleDebug
          elif [ -f "S25_Subtitle_App/build.gradle" ]; then
            cd S25_Subtitle_App && gradle assembleDebug
          else
            echo "Gradle config not found!" && exit 1
          fi

      - name: Upload S25 APK
        uses: actions/upload-artifact@v4
        with:
          name: S25-Subtitle-Overlay-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
