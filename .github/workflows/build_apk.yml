name: Build S25 Subtitle APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Unlimited MQTT S25 APK
        run: |
          if [ -d "S25_Subtitle_App" ]; then
            cd S25_Subtitle_App
          fi

          CH_ID=$(grep -oP 's25_sub_[a-zA-Z0-9_]+' app/src/main/java/com/speed/s25subtitle/MainActivity.kt | head -n 1 || true)
          if [ -z "$CH_ID" ]; then
            CH_ID="s25_sub_default"
          fi

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:label="S25 투명 자막기"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/speed/s25subtitle/OverlayService.kt
          package com.speed.s25subtitle

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.view.*
          import android.widget.LinearLayout
          import android.widget.TextView
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.EOFException
          import java.io.InputStream
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.net.SocketTimeoutException
          import kotlin.math.abs

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var subContainer: LinearLayout? = null
              private var dragHandle: TextView? = null
              private lateinit var srcView: OutlinedTextView
              private lateinit var koView: OutlinedTextView
              private lateinit var subParams: WindowManager.LayoutParams
              private lateinit var handleParams: WindowManager.LayoutParams

              @Volatile private var running = false
              private val uiHandler = Handler(Looper.getMainLooper())
              private var channelId = ""
              private var delayMs = 0
              private var showSource = true

              private val brokers = arrayOf(
                  "broker.emqx.io",
                  "broker.hivemq.com",
                  "test.mosquitto.org"
              )

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  channelId = intent?.getStringExtra("channel") ?: "s25_sub_default"
                  val koSize = intent?.getFloatExtra("ko_size", 20f) ?: 20f
                  delayMs = intent?.getIntExtra("delay_ms", 0) ?: 0

                  startForegroundNotification()
                  setupOverlayViews(koSize)
                  startUnlimitedMqttReader()
                  return START_STICKY
              }

              private fun startForegroundNotification() {
                  val chId = "s25_overlay_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val ch = NotificationChannel(chId, "S25 무제한 자막 서비스", NotificationManager.IMPORTANCE_LOW)
                      nm.createNotificationChannel(ch)
                      val notif = Notification.Builder(this, chId)
                          .setContentTitle("S25 무제한 투명 자막 작동 중")
                          .setContentText("채널: $channelId (일일 한도 무제한)")
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .build()
                      startForeground(1001, notif)
                  }
              }

              private fun setupOverlayViews(koSize: Float) {
                  removeOverlays()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val dm = resources.displayMetrics

                  subContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.TRANSPARENT)
                      setPadding(24, 8, 24, 8)
                  }

                  srcView = OutlinedTextView(this).apply {
                      text = "[$channelId] 무제한 실시간 서버 연결 중..."
                      textSize = (koSize * 0.62f).coerceAtLeast(11f)
                      setTextColor(Color.parseColor("#DDDDDD"))
                      strokeWidthPx = 6f
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }

                  koView = OutlinedTextView(this).apply {
                      text = "유튜브·트위치 앱을 켜고 편안하게 감상하세요!"
                      textSize = koSize
                      setTextColor(Color.parseColor("#00FF7F"))
                      strokeWidthPx = 9f
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }

                  subContainer?.addView(srcView)
                  subContainer?.addView(koView)

                  subParams = WindowManager.LayoutParams(
                      (dm.widthPixels * 0.92).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = (dm.heightPixels * 0.76).toInt()
                  }

                  val pillBg = GradientDrawable().apply {
                      setColor(Color.parseColor("#66000000"))
                      cornerRadius = 40f
                      setStroke(2, Color.parseColor("#8800FF7F"))
                  }

                  dragHandle = TextView(this).apply {
                      text = "✥"
                      textSize = 15f
                      setTextColor(Color.parseColor("#00FF7F"))
                      gravity = Gravity.CENTER
                      background = pillBg
                      setPadding(22, 12, 22, 12)
                  }

                  handleParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = 16
                      y = subParams.y
                  }

                  var initialY = 0
                  var touchY = 0f
                  var downTime = 0L

                  dragHandle?.setOnTouchListener { _, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialY = subParams.y
                              touchY = ev.rawY
                              downTime = System.currentTimeMillis()
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dy = (ev.rawY - touchY).toInt()
                              subParams.y = initialY + dy
                              handleParams.y = initialY + dy
                              try {
                                  wm.updateViewLayout(subContainer, subParams)
                                  wm.updateViewLayout(dragHandle, handleParams)
                              } catch (_: Exception) {}
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              val elapsed = System.currentTimeMillis() - downTime
                              val moved = abs(ev.rawY - touchY)
                              if (elapsed > 900 && moved < 25f) {
                                  stopSelf()
                              } else if (elapsed < 300 && moved < 20f) {
                                  // 짧게 1번 탭하면 원문 표시/숨김 즉시 토글
                                  showSource = !showSource
                                  srcView.visibility = if (showSource) View.VISIBLE else View.GONE
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  wm.addView(subContainer, subParams)
                  wm.addView(dragHandle, handleParams)
              }

              private fun encodeVarLen(len: Int): ByteArray {
                  var l = len
                  val out = ByteArrayOutputStream()
                  do {
                      var b = l % 128
                      l /= 128
                      if (l > 0) b = b or 0x80
                      out.write(b)
                  } while (l > 0)
                  return out.toByteArray()
              }

              private fun buildConnectPacket(clientId: String): ByteArray {
                  val cid = clientId.toByteArray(Charsets.UTF_8)
                  val body = ByteArrayOutputStream()
                  body.write(byteArrayOf(0x00, 0x04, 'M'.code.toByte(), 'Q'.code.toByte(), 'T'.code.toByte(), 'T'.code.toByte(), 0x04, 0x02, 0x00, 0x3c))
                  body.write((cid.size shr 8) and 0xFF)
                  body.write(cid.size and 0xFF)
                  body.write(cid)
                  val bArr = body.toByteArray()
                  val pkt = ByteArrayOutputStream()
                  pkt.write(0x10)
                  pkt.write(encodeVarLen(bArr.size))
                  pkt.write(bArr)
                  return pkt.toByteArray()
              }

              private fun buildSubscribePacket(topic: String): ByteArray {
                  val tBytes = topic.toByteArray(Charsets.UTF_8)
                  val body = ByteArrayOutputStream()
                  body.write(byteArrayOf(0x00, 0x01))
                  body.write((tBytes.size shr 8) and 0xFF)
                  body.write(tBytes.size and 0xFF)
                  body.write(tBytes)
                  body.write(0x00)
                  val bArr = body.toByteArray()
                  val pkt = ByteArrayOutputStream()
                  pkt.write(0x82)
                  pkt.write(encodeVarLen(bArr.size))
                  pkt.write(bArr)
                  return pkt.toByteArray()
              }

              private fun readExact(input: InputStream, buf: ByteArray) {
                  var total = 0
                  while (total < buf.size) {
                      val r = input.read(buf, total, buf.size - total)
                      if (r == -1) throw EOFException()
                      total += r
                  }
              }

              private fun startUnlimitedMqttReader() {
                  running = false
                  try { Thread.sleep(100) } catch (_: Exception) {}
                  running = true

                  Thread {
                      var bIdx = 0
                      while (running) {
                          var sock: Socket? = null
                          try {
                              val host = brokers[bIdx % brokers.size]
                              sock = Socket()
                              sock.connect(InetSocketAddress(host, 1883), 4500)
                              sock.soTimeout = 25000

                              val out = sock.getOutputStream()
                              val input = sock.getInputStream()

                              val cid = "s25_${channelId}_${System.currentTimeMillis() % 100000}"
                              out.write(buildConnectPacket(cid))
                              out.flush()

                              val connAck = ByteArray(4)
                              readExact(input, connAck)

                              val topic = "s25_live_sub/$channelId"
                              out.write(buildSubscribePacket(topic))
                              out.flush()

                              uiHandler.post {
                                  srcView.text = "[$channelId] 🟢 무제한 실시간 서버 연결 완료!"
                              }

                              while (running) {
                                  try {
                                      val header = input.read()
                                      if (header == -1) throw EOFException()

                                      var multiplier = 1
                                      var remLen = 0
                                      while (true) {
                                          val eb = input.read()
                                          if (eb == -1) throw EOFException()
                                          remLen += (eb and 127) * multiplier
                                          if ((eb and 128) == 0) break
                                          multiplier *= 128
                                      }

                                      val payloadBuf = ByteArray(remLen)
                                      if (remLen > 0) {
                                          readExact(input, payloadBuf)
                                      }

                                      val pktType = (header shr 4) and 0x0F
                                      if (pktType == 3 && remLen > 2) {
                                          val tLen = ((payloadBuf[0].toInt() and 0xFF) shl 8) or (payloadBuf[1].toInt() and 0xFF)
                                          val qos = (header shr 1) and 0x03
                                          val offset = 2 + tLen + if (qos > 0) 2 else 0
                                          if (offset < remLen) {
                                              val msgStr = String(payloadBuf, offset, remLen - offset, Charsets.UTF_8).trim()
                                              if (msgStr.startsWith("{")) {
                                                  val subObj = JSONObject(msgStr)
                                                  val lang = subObj.optString("lang", "EN")
                                                  val src = subObj.optString("src", "")
                                                  val ko = subObj.optString("ko", "")
                                                  val task = Runnable {
                                                      srcView.text = "[$lang] $src"
                                                      koView.text = ko
                                                  }
                                                  if (delayMs > 0) {
                                                      uiHandler.postDelayed(task, delayMs.toLong())
                                                  } else {
                                                      uiHandler.post(task)
                                                  }
                                              }
                                          }
                                      }
                                  } catch (_: SocketTimeoutException) {
                                      out.write(byteArrayOf(0xC0.toByte(), 0x00.toByte()))
                                      out.flush()
                                  }
                              }
                          } catch (_: Exception) {
                              bIdx++
                              try { Thread.sleep(1500) } catch (_: Exception) {}
                          } finally {
                              try { sock?.close() } catch (_: Exception) {}
                          }
                      }
                  }.apply {
                      isDaemon = true
                      start()
                  }
              }

              private fun removeOverlays() {
                  try {
                      if (subContainer != null) wm.removeView(subContainer)
                  } catch (_: Exception) {}
                  try {
                      if (dragHandle != null) wm.removeView(dragHandle)
                  } catch (_: Exception) {}
                  subContainer = null
                  dragHandle = null
              }

              override fun onDestroy() {
                  running = false
                  removeOverlays()
                  super.onDestroy()
              }
          }
          EOF

          gradle assembleDebug --no-daemon

      - name: Upload S25 APK
        uses: actions/upload-artifact@v4
        with:
          name: S25-Subtitle-Overlay-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
